# Industry universe for the cycle screen.
# Edit freely: add/remove industries or tickers. The script flags any ticker
# or FRED series that returns no data, so bad IDs show up in the data health
# section of the report rather than breaking the run.
#
# Fields per industry:
#   rs_us:        US ETF (single) or basket of US tickers for relative strength vs SPY
#   rs_asx:       ASX basket for relative strength vs STW.AX (optional)
#   fred_price:   pricing series (commodity price or producer price index)
#   fred_capu:    capacity utilisation series (optional)
#   bellwethers:  US 10-K filers used for capex/D&A, margins and EPS revisions
#   capex_relevant: false for industries where capex/D&A is meaningless

benchmarks:
  us: SPY
  asx: STW.AX

industries:
